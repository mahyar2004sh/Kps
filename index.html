<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوسه از صفحه</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to bottom, #0a001f, #1a0033, #330044);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1200px;
            font-family: 'Vazirmatn', sans-serif;
        }

        .scene {
            width: 100vw;
            height: 100vh;
            position: relative;
            transform-style: preserve-3d;
        }

        /* آدمک استیکی */
        .stickman {
            position: absolute;
            left: 50%;
            bottom: 10%;
            transform: translateX(-50%) scale(0.12) translateZ(-800px);
            width: 180px;
            height: 280px;
            transition: all 5s cubic-bezier(0.25, 0.1, 0.25, 1);
            filter: drop-shadow(0 40px 60px rgba(255, 100, 200, 0.7));
        }

        .stickman.animate {
            transform: translateX(-50%) scale(1.15) translateZ(80px) rotateX(12deg);
            bottom: 22%;
        }

        /* سر */
        .head {
            position: absolute;
            left: 50%;
            top: 20px;
            width: 60px;
            height: 60px;
            background: #ffdbac;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: inset 0 8px 15px rgba(0,0,0,0.3);
        }

        /* بدن */
        .body {
            position: absolute;
            left: 50%;
            top: 75px;
            width: 18px;
            height: 110px;
            background: linear-gradient(#ff6bcb, #c445ff);
            transform: translateX(-50%);
            border-radius: 30px;
        }

        /* دست‌ها */
        .arm {
            position: absolute;
            width: 12px;
            height: 80px;
            background: #ffdbac;
            top: 85px;
            border-radius: 30px;
            transform-origin: top center;
        }
        .arm.left { left: 25px; transform: rotate(-35deg); }
        .arm.right { right: 25px; transform: rotate(35deg); }

        /* پاها */
        .leg {
            position: absolute;
            width: 14px;
            height: 95px;
            background: #ff6bcb;
            bottom: -75px;
            border-radius: 30px;
            transform-origin: top center;
        }
        .leg.left { left: 32px; }
        .leg.right { right: 32px; }

        /* انیمیشن راه رفتن */
        .walking .leg.left {
            animation: walkLeft 0.6s infinite alternate ease-in-out;
        }
        .walking .leg.right {
            animation: walkRight 0.6s infinite alternate ease-in-out;
        }
        .walking .arm.left {
            animation: swingLeft 0.6s infinite alternate ease-in-out;
        }
        .walking .arm.right {
            animation: swingRight 0.6s infinite alternate ease-in-out;
        }

        @keyframes walkLeft {
            from { transform: rotate(-25deg); }
            to { transform: rotate(35deg); }
        }
        @keyframes walkRight {
            from { transform: rotate(35deg); }
            to { transform: rotate(-25deg); }
        }
        @keyframes swingLeft {
            from { transform: rotate(-50deg); }
            to { transform: rotate(20deg); }
        }
        @keyframes swingRight {
            from { transform: rotate(50deg); }
            to { transform: rotate(-20deg); }
        }

        /* لب بوسه */
        .kiss {
            position: absolute;
            bottom: 28%;
            left: 50%;
            font-size: 90px;
            transform: translateX(-50%) scale(0);
            opacity: 0;
            transition: all 0.7s cubic-bezier(0.68, -0.6, 0.32, 1.6);
            z-index: 10;
            filter: drop-shadow(0 10px 20px #ff1493);
        }

        .kiss.show {
            transform: translateX(-50%) scale(1.35);
            opacity: 1;
        }

        .heart {
            position: absolute;
            font-size: 42px;
            z-index: 8;
            animation: heartFloat 4s linear forwards;
        }

        @keyframes heartFloat {
            0% { transform: translateY(0) scale(0.3); opacity: 0; }
            25% { opacity: 1; }
            100% { transform: translateY(-380px) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="stickman" id="stickman">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
        </div>
        
        <div class="kiss" id="kiss">💋</div>
    </div>

    <script>
        const stickman = document.getElementById('stickman');
        const kiss = document.getElementById('kiss');

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.bottom = '15%';
            heart.style.animationDuration = (3 + Math.random() * 2) + 's';
            document.querySelector('.scene').appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        // شروع انیمیشن
        setTimeout(() => {
            stickman.classList.add('animate', 'walking');
            
            setTimeout(() => {
                kiss.classList.add('show');
                
                // قلب‌ها
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => createHeart(), i * 90);
                }
            }, 2800);
        }, 400);

        // کلیک برای تکرار
        document.addEventListener('click', () => {
            kiss.classList.remove('show');
            setTimeout(() => {
                kiss.classList.add('show');
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => createHeart(), i * 70);
                }
            }, 100);
        });

        // قلب‌های زمینه
        setInterval(() => {
            if (Math.random() > 0.5) createHeart();
        }, 550);
    </script>
</body>
</html>
