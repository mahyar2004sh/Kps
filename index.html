<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بوسه شیرین · آدمک صورتی</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0d0015;
            font-family: Arial, Helvetica, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 200, 255, 0.2);
            font-size: 12px;
            pointer-events: none;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="info">✦ لمس کن تا قلب ببارد ✦</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- صحنه و دوربین (نمای گوشی، روبرو) ---
        const scene = new THREE.Scene();

        // پس‌زمینه رویایی
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
        gradient.addColorStop(0, '#ffb3d9');
        gradient.addColorStop(0.3, '#cc88ff');
        gradient.addColorStop(0.7, '#7744aa');
        gradient.addColorStop(1, '#1a0033');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);
        scene.background = new THREE.CanvasTexture(canvas);

        scene.fog = new THREE.FogExp2(0x1a0033, 0.015);

        // دوربین: دقیقاً در ارتفاع گوشی (نه پایین، نه بالا)
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0.65, 0.1);
        camera.lookAt(0, 0.7, -3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.prepend(renderer.domElement);
        document.getElementById('info').style.display = 'none';

        // --- نورپردازی نرم و رویایی ---
        const ambient = new THREE.AmbientLight(0x554477, 0.6);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffddff, 1.6);
        mainLight.position.set(4, 6, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0xff88bb, 1.2);
        rimLight.position.set(-5, 1, -6);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0x88ddff, 0.5);
        fillLight.position.set(-2, 1, 5);
        scene.add(fillLight);

        const glowLight = new THREE.PointLight(0xff44aa, 1.2, 12);
        glowLight.position.set(0, 0.9, -1);
        scene.add(glowLight);

        // --- بافت قلب ---
        function createHeartTexture(color = '#ff4d7a', glow = false) {
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 128;
            const cx = c.getContext('2d');
            cx.clearRect(0, 0, 128, 128);
            if (glow) {
                const grd = cx.createRadialGradient(64, 64, 0, 64, 64, 64);
                grd.addColorStop(0, 'rgba(255,80,150,0.7)');
                grd.addColorStop(1, 'rgba(255,80,150,0)');
                cx.fillStyle = grd;
                cx.fillRect(0, 0, 128, 128);
            }
            cx.fillStyle = color;
            cx.shadowColor = 'rgba(255,80,200,0.8)';
            cx.shadowBlur = 20;
            cx.beginPath();
            cx.moveTo(64, 88);
            cx.bezierCurveTo(24, 56, 0, 28, 32, 12);
            cx.bezierCurveTo(48, 4, 64, 18, 64, 28);
            cx.bezierCurveTo(64, 18, 80, 4, 96, 12);
            cx.bezierCurveTo(128, 28, 104, 56, 64, 88);
            cx.fill();
            return new THREE.CanvasTexture(c);
        }
        const heartTex = createHeartTexture('#ff4d7a');
        const heartGlowTex = createHeartTexture('#ff2a5e', true);

        // --- ساخت آدمک (رنگ کرمی، موهای مشکی) ---
        function createStickman() {
            const root = new THREE.Group();

            // رنگ‌های جدید: کرمی و مشکی
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5d6b8, roughness: 0.3, metalness: 0.05 });
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf5d6b8, roughness: 0.3 });
            const hairMat = new THREE.MeshStandardMaterial({
                color: 0x222222,
                roughness: 0.7,
                emissive: 0x111111,
                emissiveIntensity: 0.1
            });
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x222222, emissiveIntensity: 0.1 });
            const blushMat = new THREE.MeshStandardMaterial({ color: 0xff4d6d, transparent: true, opacity: 0.4 });
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0x222222, emissiveIntensity: 0.1 });

            // بالاتنه
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.5, 8), bodyMat);
            torso.position.y = 0.25;
            torso.castShadow = true;
            root.add(torso);

            // سر
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 24), skinMat);
            head.position.y = 0.6;
            head.castShadow = true;
            root.add(head);

            // موهای مشکی (پف دار)
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), hairMat);
            hairBase.position.set(0, 0.7, 0.02);
            hairBase.scale.set(1, 0.4, 0.9);
            root.add(hairBase);

            const hairTop = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.25, 10), hairMat);
            hairTop.position.set(0, 0.8, 0.02);
            hairTop.rotation.x = 0.1;
            root.add(hairTop);

            // دو تا غنچه موی مشکی
            const bunMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6 });
            const bun1 = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), bunMat);
            bun1.position.set(-0.18, 0.68, 0.0);
            root.add(bun1);
            const bun2 = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), bunMat);
            bun2.position.set(0.18, 0.68, 0.0);
            root.add(bun2);

            // چشم‌ها
            const eyeGeo = new THREE.SphereGeometry(0.04, 10, 10);
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.07, 0.63, 0.18);
            root.add(eyeL);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.07, 0.63, 0.18);
            root.add(eyeR);

            // هایلایت چشم
            const highMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6 });
            const highGeo = new THREE.SphereGeometry(0.012, 6, 6);
            const hL = new THREE.Mesh(highGeo, highMat);
            hL.position.set(-0.055, 0.645, 0.21);
            root.add(hL);
            const hR = new THREE.Mesh(highGeo, highMat);
            hR.position.set(0.085, 0.645, 0.21);
            root.add(hR);

            // رژگونه
            const blush = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), blushMat);
            blush.position.set(-0.16, 0.56, 0.14);
            root.add(blush);
            const blush2 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), blushMat);
            blush2.position.set(0.16, 0.56, 0.14);
            root.add(blush2);

            // پاها
            const legGeo = new THREE.CylinderGeometry(0.05, 0.06, 0.38, 6);
            const legMat = new THREE.MeshStandardMaterial({ color: 0xf5d6b8, roughness: 0.3 });

            const leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(-0.09, 0.0, 0);
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.y = -0.19;
            leftLeg.castShadow = true;
            leftLegPivot.add(leftLeg);
            const shoe = new THREE.Mesh(new THREE.SphereGeometry(0.065, 6, 6), shoeMat);
            shoe.position.set(0, -0.38, 0.04);
            leftLegPivot.add(shoe);
            root.add(leftLegPivot);

            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(0.09, 0.0, 0);
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.y = -0.19;
            rightLeg.castShadow = true;
            rightLegPivot.add(rightLeg);
            const shoeR = new THREE.Mesh(new THREE.SphereGeometry(0.065, 6, 6), shoeMat);
            shoeR.position.set(0, -0.38, 0.04);
            rightLegPivot.add(shoeR);
            root.add(rightLegPivot);

            // دست‌ها
            const armGeo = new THREE.CylinderGeometry(0.035, 0.04, 0.38, 6);
            const armMat = new THREE.MeshStandardMaterial({ color: 0xf5d6b8, roughness: 0.3 });

            const leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(-0.18, 0.42, 0);
            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.y = -0.19;
            leftArm.castShadow = true;
            leftArmPivot.add(leftArm);
            const hand = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), armMat);
            hand.position.set(0, -0.38, 0);
            leftArmPivot.add(hand);
            root.add(leftArmPivot);

            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(0.18, 0.42, 0);
            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.y = -0.19;
            rightArm.castShadow = true;
            rightArmPivot.add(rightArm);
            const handR = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), armMat);
            handR.position.set(0, -0.38, 0);
            rightArmPivot.add(handR);
            root.add(rightArmPivot);

            // ذخیره برای انیمیشن
            root.userData = {
                leftLegPivot,
                rightLegPivot,
                leftArmPivot,
                rightArmPivot,
                torso,
                head,
                leftArm,
                rightArm,
                leftLeg,
                rightLeg,
                eyeL,
                eyeR
            };

            return root;
        }

        const stickman = createStickman();
        stickman.position.set(0, 0.0, -20);
        scene.add(stickman);

        // هاله نور
        const auraMat = new THREE.SpriteMaterial({
            map: heartGlowTex,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.25
        });
        const aura = new THREE.Sprite(auraMat);
        aura.scale.set(2.5, 2.5, 1);
        stickman.add(aura);

        // --- سیستم قلب‌ها ---
        const hearts = [];
        const heartSpriteMat = new THREE.SpriteMaterial({
            map: heartTex,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            opacity: 0.9
        });

        function spawnHeart(x, y, z, scale = 0.3) {
            const sprite = new THREE.Sprite(heartSpriteMat.clone());
            sprite.position.set(x, y, z);
            sprite.scale.set(scale, scale, 1);
            sprite.userData = {
                vx: (Math.random() - 0.5) * 0.6,
                vy: Math.random() * 0.5 + 0.2,
                vz: -Math.random() * 0.4 - 0.2,
                life: 1.0,
                decay: 0.0015 + Math.random() * 0.002,
                rotSpeed: (Math.random() - 0.5) * 0.02
            };
            scene.add(sprite);
            hearts.push(sprite);
            return sprite;
        }

        for (let i = 0; i < 35; i++) {
            const z = -Math.random() * 28 - 2;
            const x = (Math.random() - 0.5) * 7;
            const y = Math.random() * 4 + 0.3;
            spawnHeart(x, y, z, 0.2 + Math.random() * 0.5);
        }

        // --- ذرات براق ---
        const sparkleGeo = new THREE.BufferGeometry();
        const sparkleCount = 150;
        const positions = new Float32Array(sparkleCount * 3);
        for (let i = 0; i < sparkleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 35;
            if (i % 3 === 1) positions[i] = Math.random() * 5 + 0.5;
            if (i % 3 === 2) positions[i] = -Math.random() * 28 - 2;
        }
        sparkleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const sparkleMat = new THREE.PointsMaterial({
            color: 0xffaacc,
            size: 0.06,
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 0.5,
            sizeAttenuation: true
        });
        const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
        scene.add(sparkles);

        // --- وضعیت انیمیشن ---
        const clock = new THREE.Clock();
        let state = 'walking';
        let kissTimer = 0;
        const KISS_TRIGGER_Z = -1.4;
        const RESET_Z = -20;

        let kissHeart = null;
        let kissFlash = null;
        let cameraTargetZ = 0.1; // برای حرکت دوربین در بوسه

        function createKissEffect() {
            const bigHeart = new THREE.Sprite(new THREE.SpriteMaterial({
                map: heartTex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 1
            }));
            bigHeart.scale.set(1.2, 1.2, 1);
            bigHeart.position.set(0, 0.7, 0.5);
            scene.add(bigHeart);

            const ring = new THREE.Sprite(new THREE.SpriteMaterial({
                map: heartGlowTex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                opacity: 0.9,
                color: 0xff3388
            }));
            ring.scale.set(3, 3, 1);
            ring.position.set(0, 0.7, 0.3);
            scene.add(ring);

            return { bigHeart, ring };
        }

        // --- حلقه اصلی ---
        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            const time = clock.getElapsedTime();

            let z = stickman.position.z;

            // ========== حالت راه رفتن ==========
            if (state === 'walking') {
                z += delta * 1.9;
                stickman.position.z = z;

                // حرکت نرم‌تر و طبیعی‌تر با دامنه بیشتر و فرکانس مناسب
                const walkSpeed = 4.2;
                const swing = Math.sin(time * walkSpeed) * 0.7;
                const swing2 = Math.sin(time * walkSpeed + Math.PI) * 0.7;

                const leftLeg = stickman.userData.leftLegPivot;
                const rightLeg = stickman.userData.rightLegPivot;
                const leftArm = stickman.userData.leftArmPivot;
                const rightArm = stickman.userData.rightArmPivot;
                const torso = stickman.userData.torso;

                leftLeg.rotation.x = swing2 * 0.65;
                rightLeg.rotation.x = swing * 0.65;
                leftArm.rotation.x = swing * 0.75;
                rightArm.rotation.x = swing2 * 0.75;

                // چرخش مچ و آرنج برای طبیعی‌تر شدن
                leftArm.rotation.z = Math.sin(time * walkSpeed) * 0.12;
                rightArm.rotation.z = Math.sin(time * walkSpeed + Math.PI) * 0.12;

                // نرم‌تر شدن بالا و پایین تنه
                torso.position.y = 0.25 + Math.sin(time * walkSpeed * 2) * 0.025;

                // چرخش ملایم کل بدن
                stickman.rotation.z = Math.sin(time * walkSpeed * 0.5) * 0.025;

                // نور دنبال‌کننده
                glowLight.position.set(
                    Math.sin(time * 0.4) * 0.2,
                    0.7 + Math.sin(time * 0.7) * 0.1,
                    z + 0.4
                );

                // تولید قلب در حین راه رفتن
                if (Math.random() < 0.12) {
                    const hz = z + (Math.random() - 0.5) * 3;
                    const hx = (Math.random() - 0.5) * 2.5;
                    const hy = Math.random() * 1.8 + 0.3;
                    spawnHeart(hx, hy, hz, 0.2 + Math.random() * 0.5);
                }

                // شرط شروع بوسه
                if (z >= KISS_TRIGGER_Z) {
                    state = 'kissing';
                    kissTimer = 0;
                    const eff = createKissEffect();
                    kissHeart = eff.bigHeart;
                    kissFlash = eff.ring;

                    // توقف حرکت دست و پا
                    stickman.userData.leftLegPivot.rotation.x = 0;
                    stickman.userData.rightLegPivot.rotation.x = 0;
                    stickman.userData.leftArmPivot.rotation.x = -0.1;
                    stickman.userData.rightArmPivot.rotation.x = -0.1;
                    cameraTargetZ = -0.7; // دوربین به جلو می‌آید
                }
            }

            // ========== حالت بوسه (کاملاً واضح و جلوی گوشی) ==========
            if (state === 'kissing') {
                kissTimer += delta;
                const duration = 2.2;

                // حرکت نرم دوربین به سمت جلو (جلوی گوشی)
                camera.position.z += (cameraTargetZ - camera.position.z) * 0.06;

                // سر و گردن به سمت دوربین خم می‌شوند (بوسه واضح)
                const head = stickman.userData.head;
                const targetHeadZ = -0.55;
                head.position.z += (targetHeadZ - head.position.z) * 0.1;

                // کج شدن سر برای بوسه (چرخش به پایین و کمی پهلو)
                const targetHeadRotX = -0.25;
                head.rotation.x += (targetHeadRotX - head.rotation.x) * 0.08;
                head.rotation.z += (0.08 - head.rotation.z) * 0.05;

                // بسته شدن چشم‌ها (برای بوسه)
                const eyeL = stickman.userData.eyeL;
                const eyeR = stickman.userData.eyeR;
                const targetEyeScale = 0.15;
                eyeL.scale.y += (targetEyeScale - eyeL.scale.y) * 0.1;
                eyeR.scale.y += (targetEyeScale - eyeR.scale.y) * 0.1;

                // حرکت قلب بزرگ به سمت لنز
                if (kissHeart) {
                    const heartZ = 0.5 - kissTimer * 0.9;
                    kissHeart.position.z = heartZ;
                    const s = 1.2 + kissTimer * 0.8;
                    kissHeart.scale.set(s, s, 1);
                    kissHeart.material.opacity = Math.max(0, 1 - kissTimer * 0.55);

                    if (kissFlash) {
                        const fs = 3 + kissTimer * 4;
                        kissFlash.scale.set(fs, fs, 1);
                        kissFlash.material.opacity = Math.max(0, 0.9 - kissTimer * 0.6);
                    }
                }

                // انفجار قلب در حین بوسه
                if (kissTimer < 0.8 && Math.random() < 0.4) {
                    for (let i = 0; i < 2; i++) {
                        const hx = (Math.random() - 0.5) * 1.8;
                        const hy = Math.random() * 1.8 + 0.3;
                        const hz = 0.2 + Math.random() * 0.3;
                        const heart = spawnHeart(hx, hy, hz, 0.3 + Math.random() * 0.5);
                        heart.userData.vx *= 2.5;
                        heart.userData.vy *= 2.5;
                        heart.userData.vz = -Math.random() * 2 - 0.5;
                    }
                }

                // بعد از اتمام بوسه، بازنشانی
                if (kissTimer > duration) {
                    state = 'reset';
                    // باز کردن چشم‌ها
                    eyeL.scale.y = 1;
                    eyeR.scale.y = 1;
                }
            }

            // ========== بازنشانی ==========
            if (state === 'reset') {
                stickman.position.z += delta * 7;
                // برگرداندن دوربین به حالت اولیه
                camera.position.z += (0.1 - camera.position.z) * 0.02;

                // برگرداندن سر به حالت عادی
                const head = stickman.userData.head;
                head.position.z += (0 - head.position.z) * 0.05;
                head.rotation.x += (0 - head.rotation.x) * 0.05;
                head.rotation.z += (0 - head.rotation.z) * 0.05;

                if (stickman.position.z > 3) {
                    stickman.position.set(0, 0, RESET_Z);
                    stickman.rotation.x = 0;
                    stickman.rotation.z = 0;
                    stickman.userData.head.position.z = 0;
                    stickman.userData.head.rotation.x = 0;
                    stickman.userData.head.rotation.z = 0;
                    stickman.userData.torso.position.y = 0.25;
                    camera.position.z = 0.1;
                    cameraTargetZ = 0.1;
                    state = 'walking';

                    if (kissHeart) { scene.remove(kissHeart);
                        kissHeart = null; }
                    if (kissFlash) { scene.remove(kissFlash);
                        kissFlash = null; }
                }
            }

            // ========== بروزرسانی قلب‌ها ==========
            for (let i = hearts.length - 1; i >= 0; i--) {
                const h = hearts[i];
                h.userData.life -= h.userData.decay * delta * 30;
                h.position.x += h.userData.vx * delta;
                h.position.y += h.userData.vy * delta;
                h.position.z += h.userData.vz * delta;
                h.rotation.z += h.userData.rotSpeed * delta * 30;

                const dist = Math.abs(h.position.z - camera.position.z);
                const newScale = 0.25 + dist * 0.025;
                h.scale.set(newScale, newScale, 1);
                h.material.opacity = h.userData.life * 0.9;

                if (h.userData.life <= 0 || h.position.z > 2) {
                    scene.remove(h);
                    hearts.splice(i, 1);
                }
            }

            // حفظ تعداد قلب‌ها
            if (hearts.length < 30 && state !== 'reset') {
                const z = stickman.position.z + (Math.random() - 0.5) * 5;
                const x = (Math.random() - 0.5) * 4;
                const y = Math.random() * 3 + 0.3;
                spawnHeart(x, y, z, 0.2 + Math.random() * 0.4);
            }

            // چرخش ذرات براق
            sparkles.rotation.y += delta * 0.015;
            sparkles.rotation.x = Math.sin(time * 0.008) * 0.05;

            // نفس کشیدن دوربین
            camera.position.y = 0.65 + Math.sin(time * 0.15) * 0.02;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- تغییر اندازه صفحه ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- کلیک برای بارش قلب (حس تعامل) ---
        window.addEventListener('click', () => {
            for (let i = 0; i < 12; i++) {
                const x = (Math.random() - 0.5) * 5;
                const y = Math.random() * 3 + 0.3;
                const z = stickman.position.z + (Math.random() - 0.5) * 4;
                const heart = spawnHeart(x, y, z, 0.3 + Math.random() * 0.6);
                heart.userData.vx *= 1.8;
                heart.userData.vy *= 1.8;
                heart.userData.vz = -Math.random() * 1.5 - 0.5;
            }
        });

        console.log('🌸 آدمک کرمی با موهای مشکی در راه است!');
    </script>
</body>
