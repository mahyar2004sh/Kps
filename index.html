<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Pink Stickman · Sweet Kiss</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0d0015;
            font-family: Arial, Helvetica, sans-serif;
        }
        /* No text, no frame — just pure 3D canvas */
        canvas {
            display: block;
        }
        /* Tiny loading hint (will disappear) */
        #info {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 200, 255, 0.3);
            font-size: 14px;
            pointer-events: none;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff69b4;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>

    <div id="info">✦ loading dreamscape ✦</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        // Vibrant dreamy background gradient (via canvas texture)
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
        gradient.addColorStop(0, '#ff99cc');
        gradient.addColorStop(0.3, '#b266ff');
        gradient.addColorStop(0.7, '#663399');
        gradient.addColorStop(1, '#1a0033');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);
        const bgTexture = new THREE.CanvasTexture(canvas);
        scene.background = bgTexture;

        // Soft fog for depth
        scene.fog = new THREE.FogExp2(0x1a0033, 0.018);

        // --- 2. Camera (Viewer POV) ---
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 0);
        camera.lookAt(0, 0.8, -5);

        // --- 3. Renderer ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);
        document.getElementById('info').style.display = 'none';

        // --- 4. Lights ---
        const ambient = new THREE.AmbientLight(0x443366, 0.6);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffddff, 1.8);
        mainLight.position.set(5, 8, 6);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0xff66aa, 1.2);
        rimLight.position.set(-4, 2, -8);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0x88ddff, 0.6);
        fillLight.position.set(-3, 1, 4);
        scene.add(fillLight);

        // Glowing backlight that follows the stickman
        const glowLight = new THREE.PointLight(0xff44aa, 1.5, 15);
        glowLight.position.set(0, 1, -2);
        scene.add(glowLight);

        // --- 5. Heart Texture (Canvas) ---
        function createHeartTexture(color = '#ff4d7a', glow = false) {
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 128;
            const cx = c.getContext('2d');
            cx.clearRect(0, 0, 128, 128);

            if (glow) {
                const grd = cx.createRadialGradient(64, 64, 0, 64, 64, 64);
                grd.addColorStop(0, 'rgba(255,100,150,0.8)');
                grd.addColorStop(1, 'rgba(255,100,150,0)');
                cx.fillStyle = grd;
                cx.fillRect(0, 0, 128, 128);
            }

            cx.fillStyle = color;
            cx.shadowColor = 'rgba(255,100,200,0.8)';
            cx.shadowBlur = 20;
            cx.beginPath();
            cx.moveTo(64, 88);
            cx.bezierCurveTo(24, 56, 0, 28, 32, 12);
            cx.bezierCurveTo(48, 4, 64, 18, 64, 28);
            cx.bezierCurveTo(64, 18, 80, 4, 96, 12);
            cx.bezierCurveTo(128, 28, 104, 56, 64, 88);
            cx.fill();
            return new THREE.CanvasTexture(c);
        }
        const heartTex = createHeartTexture('#ff4d7a');
        const heartGlowTex = createHeartTexture('#ff2a5e', true);

        // --- 6. Build the Cute Pink-Haired Stickman ---
        function createStickman() {
            const root = new THREE.Group();

            // Materials
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccdd, roughness: 0.25, metalness: 0.05 });
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffaacc, roughness: 0.3, metalness: 0.1 });
            const hairMat = new THREE.MeshStandardMaterial({
                color: 0xff69b4,
                roughness: 0.6,
                emissive: 0xff1493,
                emissiveIntensity: 0.15
            });
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x220033, emissive: 0x440066, emissiveIntensity: 0.2 });
            const blushMat = new THREE.MeshStandardMaterial({ color: 0xff4d6d, transparent: true, opacity: 0.5 });
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0xff3388, emissive: 0xff0055, emissiveIntensity: 0.1 });

            // --- Torso ---
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.5, 8), bodyMat);
            torso.position.y = 0.25;
            torso.castShadow = true;
            root.add(torso);

            // --- Head ---
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 20), skinMat);
            head.position.y = 0.62;
            head.castShadow = true;
            root.add(head);

            // --- Hair (Fluffy pink) ---
            const hairBase = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), hairMat);
            hairBase.position.set(0, 0.72, 0.02);
            hairBase.scale.set(1, 0.45, 0.9);
            root.add(hairBase);

            // Hair top (cone / ponytail)
            const hairTop = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.25, 10), hairMat);
            hairTop.position.set(0, 0.82, 0.02);
            hairTop.rotation.x = 0.1;
            root.add(hairTop);

            // Side hair buns
            const bunMat = new THREE.MeshStandardMaterial({ color: 0xff88bb, roughness: 0.5, emissive: 0xff1493,
                emissiveIntensity: 0.1 });
            const bun1 = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), bunMat);
            bun1.position.set(-0.2, 0.7, 0.0);
            root.add(bun1);
            const bun2 = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), bunMat);
            bun2.position.set(0.2, 0.7, 0.0);
            root.add(bun2);

            // --- Eyes (kawaii) ---
            const eyeGeo = new THREE.SphereGeometry(0.045, 8, 8);
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.08, 0.65, 0.19);
            root.add(eyeL);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.08, 0.65, 0.19);
            root.add(eyeR);

            // Eye highlights
            const highMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5 });
            const highGeo = new THREE.SphereGeometry(0.015, 6, 6);
            const hL = new THREE.Mesh(highGeo, highMat);
            hL.position.set(-0.065, 0.665, 0.22);
            root.add(hL);
            const hR = new THREE.Mesh(highGeo, highMat);
            hR.position.set(0.095, 0.665, 0.22);
            root.add(hR);

            // --- Blush ---
            const blush = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), blushMat);
            blush.position.set(-0.17, 0.58, 0.15);
            root.add(blush);
            const blush2 = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), blushMat);
            blush2.position.set(0.17, 0.58, 0.15);
            root.add(blush2);

            // --- Legs ---
            const legGeo = new THREE.CylinderGeometry(0.055, 0.065, 0.4, 6);
            const legMat = new THREE.MeshStandardMaterial({ color: 0xffaacc, roughness: 0.3 });

            const leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(-0.1, 0.0, 0);
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.y = -0.2;
            leftLeg.castShadow = true;
            leftLegPivot.add(leftLeg);
            // Shoe
            const shoe = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), shoeMat);
            shoe.position.set(0, -0.4, 0.04);
            leftLegPivot.add(shoe);
            root.add(leftLegPivot);

            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(0.1, 0.0, 0);
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.y = -0.2;
            rightLeg.castShadow = true;
            rightLegPivot.add(rightLeg);
            const shoeR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), shoeMat);
            shoeR.position.set(0, -0.4, 0.04);
            rightLegPivot.add(shoeR);
            root.add(rightLegPivot);

            // --- Arms ---
            const armGeo = new THREE.CylinderGeometry(0.04, 0.045, 0.4, 6);
            const armMat = new THREE.MeshStandardMaterial({ color: 0xffbbdd, roughness: 0.3 });

            const leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(-0.2, 0.45, 0);
            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.y = -0.2;
            leftArm.castShadow = true;
            leftArmPivot.add(leftArm);
            // Hand (tiny sphere)
            const handMat = new THREE.MeshStandardMaterial({ color: 0xffaacc });
            const hand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), handMat);
            hand.position.set(0, -0.4, 0);
            leftArmPivot.add(hand);
            root.add(leftArmPivot);

            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(0.2, 0.45, 0);
            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.y = -0.2;
            rightArm.castShadow = true;
            rightArmPivot.add(rightArm);
            const handR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), handMat);
            handR.position.set(0, -0.4, 0);
            rightArmPivot.add(handR);
            root.add(rightArmPivot);

            // Store pivots for animation
            root.userData = {
                leftLegPivot,
                rightLegPivot,
                leftArmPivot,
                rightArmPivot,
                torso,
                head,
                leftArm,
                rightArm,
                leftLeg,
                rightLeg
            };

            return root;
        }

        const stickman = createStickman();
        // Start far away, scaled by perspective naturally via Z
        stickman.position.set(0, 0.0, -22);
        scene.add(stickman);

        // A small glowing aura around the stickman
        const auraMat = new THREE.SpriteMaterial({
            map: heartGlowTex,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.3
        });
        const aura = new THREE.Sprite(auraMat);
        aura.scale.set(3, 3, 1);
        stickman.add(aura);

        // --- 7. Floating Hearts System ---
        const hearts = [];
        const heartSpriteMat = new THREE.SpriteMaterial({
            map: heartTex,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            opacity: 0.9
        });

        function spawnHeart(x, y, z, scale = 0.3) {
            const sprite = new THREE.Sprite(heartSpriteMat.clone());
            sprite.position.set(x, y, z);
            sprite.scale.set(scale, scale, 1);
            sprite.userData = {
                vx: (Math.random() - 0.5) * 0.8,
                vy: Math.random() * 0.6 + 0.2,
                vz: -Math.random() * 0.5 - 0.3,
                life: 1.0,
                decay: 0.002 + Math.random() * 0.003,
                rotSpeed: (Math.random() - 0.5) * 0.02
            };
            scene.add(sprite);
            hearts.push(sprite);
            return sprite;
        }

        // Pre-spawn some hearts
        for (let i = 0; i < 40; i++) {
            const z = -Math.random() * 30 - 2;
            const x = (Math.random() - 0.5) * 8;
            const y = Math.random() * 4 + 0.5;
            const s = 0.2 + Math.random() * 0.6;
            spawnHeart(x, y, z, s);
        }

        // --- 8. Sparkles / Glow particles ---
        const sparkleGeo = new THREE.BufferGeometry();
        const sparkleCount = 200;
        const positions = new Float32Array(sparkleCount * 3);
        for (let i = 0; i < sparkleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 40;
            if (i % 3 === 1) positions[i] = Math.random() * 6 + 0.5; // y
            if (i % 3 === 2) positions[i] = -Math.random() * 30 - 2; // z
        }
        sparkleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const sparkleMat = new THREE.PointsMaterial({
            color: 0xff88cc,
            size: 0.08,
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 0.6,
            sizeAttenuation: true
        });
        const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
        scene.add(sparkles);

        // --- 9. Animation State ---
        const clock = new THREE.Clock();
        let state = 'walking'; // 'walking' | 'kissing' | 'reset'
        let kissTimer = 0;
        const KISS_TRIGGER_Z = -1.2;
        const RESET_Z = -22;

        // Kiss effects
        let kissHeart = null;
        let kissFlash = null;

        function createKissEffect() {
            // Big heart that flies to camera
            const bigHeart = new THREE.Sprite(new THREE.SpriteMaterial({
                map: heartTex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            }));
            bigHeart.scale.set(0.8, 0.8, 1);
            bigHeart.position.copy(stickman.position);
            bigHeart.position.y += 0.8;
            bigHeart.position.z += 0.5;
            scene.add(bigHeart);

            // Flash ring
            const ringMat = new THREE.SpriteMaterial({
                map: heartGlowTex,
                transparent: true,
                blending: THREE.AdditiveBlending,
                opacity: 0.8,
                color: 0xff3388
            });
            const ring = new THREE.Sprite(ringMat);
            ring.scale.set(2.5, 2.5, 1);
            ring.position.copy(stickman.position);
            ring.position.z += 0.8;
            scene.add(ring);

            return { bigHeart, ring };
        }

        // --- 10. Main Loop ---
        function animate() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Update stickman position
            let speed = 1.8;
            let z = stickman.position.z;

            if (state === 'walking') {
                z += delta * speed;
                stickman.position.z = z;

                // Walk cycle animation
                const walkSpeed = 5.5;
                const swing = Math.sin(time * walkSpeed) * 0.5;
                const swing2 = Math.sin(time * walkSpeed + Math.PI) * 0.5;

                const leftLeg = stickman.userData.leftLegPivot;
                const rightLeg = stickman.userData.rightLegPivot;
                const leftArm = stickman.userData.leftArmPivot;
                const rightArm = stickman.userData.rightArmPivot;
                const torso = stickman.userData.torso;

                leftLeg.rotation.x = swing2 * 0.6;
                rightLeg.rotation.x = swing * 0.6;
                leftArm.rotation.x = swing * 0.7;
                rightArm.rotation.x = swing2 * 0.7;

                // Add natural sway (Z rotation of arms)
                leftArm.rotation.z = Math.sin(time * walkSpeed) * 0.1;
                rightArm.rotation.z = Math.sin(time * walkSpeed + Math.PI) * 0.1;

                // Body bob
                torso.position.y = 0.25 + Math.sin(time * walkSpeed * 2) * 0.02;

                // Slight whole-body sway
                stickman.rotation.z = Math.sin(time * walkSpeed * 0.5) * 0.02;

                // Glow light follows
                glowLight.position.set(
                    Math.sin(time * 0.5) * 0.3,
                    0.8 + Math.sin(time) * 0.1,
                    z + 0.5
                );

                // Spawn hearts occasionally
                if (Math.random() < 0.15) {
                    const hz = z + (Math.random() - 0.5) * 3;
                    const hx = (Math.random() - 0.5) * 2;
                    const hy = Math.random() * 1.5 + 0.5;
                    const s = 0.2 + Math.random() * 0.5;
                    spawnHeart(hx, hy, hz, s);
                }

                // Check if close enough to kiss
                if (z >= KISS_TRIGGER_Z) {
                    state = 'kissing';
                    kissTimer = 0;
                    // Trigger kiss effect
                    const eff = createKissEffect();
                    kissHeart = eff.bigHeart;
                    kissFlash = eff.ring;

                    // Stop walking, lean in
                    stickman.userData.leftLegPivot.rotation.x = 0;
                    stickman.userData.rightLegPivot.rotation.x = 0;
                    stickman.userData.leftArmPivot.rotation.x = -0.2;
                    stickman.userData.rightArmPivot.rotation.x = -0.2;
                }
            }

            if (state === 'kissing') {
                kissTimer += delta;
                const duration = 1.8; // seconds

                // Lean the whole stickman forward
                const leanProgress = Math.min(kissTimer / 0.3, 1);
                stickman.rotation.x = -leanProgress * 0.35;

                // Move head forward for the kiss
                const head = stickman.userData.head;
                const headTargetZ = -0.25 * leanProgress;
                head.position.z = headTargetZ;

                // Slight blush intensify
                // Move the kiss heart towards camera
                if (kissHeart) {
                    const heartZ = stickman.position.z + 0.8 - kissTimer * 1.2;
                    kissHeart.position.z = heartZ;
                    const s = 0.8 + kissTimer * 0.6;
                    kissHeart.scale.set(s, s, 1);
                    kissHeart.material.opacity = Math.max(0, 1 - kissTimer * 0.6);

                    // Flash ring
                    if (kissFlash) {
                        const fs = 2.5 + kissTimer * 3;
                        kissFlash.scale.set(fs, fs, 1);
                        kissFlash.material.opacity = Math.max(0, 0.8 - kissTimer * 0.5);
                    }
                }

                // Spawn explosion of hearts during kiss
                if (kissTimer < 0.6 && Math.random() < 0.5) {
                    for (let i = 0; i < 3; i++) {
                        const hx = (Math.random() - 0.5) * 1.5;
                        const hy = Math.random() * 1.5 + 0.5;
                        const hz = stickman.position.z + 0.3 + Math.random() * 0.5;
                        const s = 0.3 + Math.random() * 0.4;
                        const heart = spawnHeart(hx, hy, hz, s);
                        heart.userData.vx *= 2;
                        heart.userData.vy *= 2;
                        heart.userData.vz = -Math.random() * 1.5 - 0.5;
                    }
                }

                if (kissTimer > duration) {
                    state = 'reset';
                }
            }

            if (state === 'reset') {
                // Fade out stickman and reset
                stickman.position.z += delta * 8;
                if (stickman.position.z > 2) {
                    // Reset everything
                    stickman.position.set(0, 0, RESET_Z);
                    stickman.rotation.x = 0;
                    stickman.rotation.z = 0;
                    const head = stickman.userData.head;
                    head.position.z = 0;
                    stickman.userData.torso.position.y = 0.25;
                    state = 'walking';

                    // Clean up kiss objects
                    if (kissHeart) { scene.remove(kissHeart);
                        kissHeart = null; }
                    if (kissFlash) { scene.remove(kissFlash);
                        kissFlash = null; }
                }
            }

            // --- Update hearts (float, move, fade) ---
            for (let i = hearts.length - 1; i >= 0; i--) {
                const h = hearts[i];
                h.userData.life -= h.userData.decay * delta * 30;
                h.position.x += h.userData.vx * delta;
                h.position.y += h.userData.vy * delta;
                h.position.z += h.userData.vz * delta;
                h.rotation.z += h.userData.rotSpeed * delta * 30;

                // Scale up as they get closer (depth effect)
                const dist = Math.abs(h.position.z - camera.position.z);
                const scale = Math.min(0.3 + dist * 0.02, 1.5);
                // But keep original scale variation
                const baseScale = h.scale.x;
                // Actually, let's just let them grow based on distance
                const newScale = 0.3 + (Math.abs(h.position.z) * 0.02);
                h.scale.set(newScale, newScale, 1);

                h.material.opacity = h.userData.life * 0.9;

                if (h.userData.life <= 0 || h.position.z > 2) {
                    scene.remove(h);
                    hearts.splice(i, 1);
                }
            }

            // Keep heart count reasonable
            if (hearts.length < 30 && state !== 'reset') {
                const z = stickman.position.z + (Math.random() - 0.5) * 6;
                const x = (Math.random() - 0.5) * 4;
                const y = Math.random() * 3 + 0.5;
                spawnHeart(x, y, z, 0.2 + Math.random() * 0.5);
            }

            // Sparkles animation
            sparkles.rotation.y += delta * 0.02;
            sparkles.rotation.x = Math.sin(time * 0.01) * 0.1;

            // Camera slight breathing
            camera.position.y = 1.2 + Math.sin(time * 0.2) * 0.03;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- 11. Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 12. Click to spawn extra hearts (fun) ---
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 10; i++) {
                const x = (Math.random() - 0.5) * 4;
                const y = Math.random() * 3 + 0.5;
                const z = stickman.position.z + (Math.random() - 0.5) * 4;
                spawnHeart(x, y, z, 0.4 + Math.random() * 0.6);
            }
        });

        console.log('🌸 3D Pink Stickman is walking to you!');
    </script>
</body>
</html>
